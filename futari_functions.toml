# Function-entry seeds for Mushihimesama Futari Ver. 1.5
#
# ReXGlue's analyzer discovers ~6065 functions; the reference XenonRecomp run
# (legacy/generated/ppc_func_mapping.cpp) found more. The gap that matters is
# REAL functions (not XenonRecomp's many ".long 0x0" data/null slots) that
# ReXGlue misses — indirect/computed-call targets with no PDATA or static call
# edge, plus a few GapFill merged into neighbors. The game computes calls into
# these and the runtime FATALs ("Call to invalid or unregistered function").
#
# This list is exactly: {legacy functions that ReXGlue can decode to real
# instruction blocks} - {ReXGlue baseline}. Data/null addresses are excluded
# (seeding them as functions corrupts surrounding real code -> "Unresolved call"
# regressions). All are bare entry seeds; the analyzer discovers each extent.
[functions]
# Two original analysis-blocking branch targets ("target not in any function"):
"0x820F3C20" = {}
"0x8210B038" = {}
# Static-call (bl) targets that land on an internal loc_ label rather than a
# function entry -> codegen emits REX_FATAL("Unresolved call from X to Y").
# COMPLETE set (grep of generated REX_FATAL("Unresolved call...)); seeding the 3
# unique targets makes them callable. 0x820E6728/0x820E6734 are mid-sub_820E6668
# (which has an 18-entry jump table).
"0x820E6728" = {}
"0x820E6734" = {}
