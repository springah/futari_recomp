# Function-entry hints for the palm_abnormal game module (loads at base 0x88000000).
#
# ReXGlue's analyzer misses functions that are only reached through computed
# calls; without these seeds the game dies with "Call to invalid or
# unregistered function" when it reaches one. Each entry is a bare entry
# address -- the analyzer works out the function's extent itself.
#
# Generated by scripts/build_module_hints.sh (needs XenonRecomp; see that
# script): XenonRecomp's function map minus what ReXGlue already registers,
# filtered to the addresses ReXGlue decodes to real instruction blocks. Do not
# hand-edit; re-run the script. The 8 game-mode modules are builds of one
# engine, so these lists differ from each other only by small address offsets.
